plugins {
  id 'org.springframework.boot' version '4.0.8' apply false
  id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
  group = 'com.tech.engg5'
  version = '0.0.1'

  repositories {
    mavenCentral()
  }
}

subprojects {
  // Apply dependency management to every module that needs dependencies.
  apply plugin: 'io.spring.dependency-management'

  dependencyManagement {
    imports {
      mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.8"
      mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.3"
    }
  }

  // Common configuration for all Java-based modules.
  plugins.withId('java') {

    java {
      toolchain {
        languageVersion = JavaLanguageVersion.of(25)
      }
    }

    tasks.withType(JavaCompile).configureEach {
      options.encoding = 'UTF-8'
    }

    dependencies {

      implementation "commons-io:commons-io:2.22.0"
      implementation "tools.jackson.core:jackson-databind"

      compileOnly 'org.projectlombok:lombok'
      annotationProcessor 'org.projectlombok:lombok'

      testCompileOnly 'org.projectlombok:lombok'
      testAnnotationProcessor 'org.projectlombok:lombok'
    }
  }

  tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
      events "passed", "skipped", "failed"
      showStandardStreams = true
      exceptionFormat = 'full'
      showStackTraces = true
      showExceptions = true
      showCauses = true
    }
  }
}