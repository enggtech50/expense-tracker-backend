services:

  vault:
    image: hashicorp/vault:1.20
    container_name: expense-tracker-vault

    ports:
      - "8200:8200"

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: tech-engg-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    cap_add:
      - IPC_LOCK

    command: server -dev

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8200/v1/sys/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped